name: 📮 订阅 / 退订邮件
description: 输入邮箱，每周一自动收《中国 SI/PHF 政策仓库》
labels: ["subscribe"]
body:
  - type: dropdown
    id: action
    attributes:
      label: 动作 / Action
      options:
        - 订阅 / Subscribe
        - 退订 / Unsubscribe
    validations:
      required: true
  - type: input
    id: email
    attributes:
      label: 邮箱 / Email
      placeholder: you@example.com
    validations:
      required: true
  - type: dropdown
    id: freq
    attributes:
      label: 频率 / Frequency
      options:
        - 每周一 / Weekly (Monday)
        - 每日 / Daily
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        🔒 **隐私说明**：邮箱以 AES-256 加密入库（`data/subscribers.enc`），维护者也无法读出明文；
        机器人会在处理后的几十秒内自动**脱敏本 issue 标题与正文**，公开页不长期保留明文；
        仓库 watcher 的实时通知邮件会含原文（当前仅维护者一人）。
        无后台服务器，不支持二次点击确认——退订随时用本表单切换「动作」即可。
