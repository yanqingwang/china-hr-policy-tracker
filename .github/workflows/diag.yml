name: diag reachability
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: probe city portals
        run: |
          for u in \
            "https://rsj.beijing.gov.cn/" "https://www.beijing.gov.cn/" \
            "https://hrss.tj.gov.cn/" "https://rsj.gz.gov.cn/" \
            "https://hrss.sz.gov.cn/" "https://rlsbj.cq.gov.cn/" \
            "https://rsj.xa.gov.cn/" "https://rsj.sz.gov.cn/" \
            "https://www.shanghai.gov.cn/" "https://sousuo.www.gov.cn/search-gov/data?t=zhengcelibrary&q=%E7%A4%BE%E4%BF%9D&sort=pubtime&p=1&n=2&jue=no" ; do
            printf "%-70s " "$u"
            curl -skL -o /dev/null -w "%{http_code} size=%{size_download}\n" -A "Mozilla/5.0" --max-time 12 "$u" || echo "FAIL"
          done
