name: daily digest

on:
  schedule:
    - cron: "0 22 * * *"      # 22:00 UTC = 每日 06:00 北京——阿里云 03:00 CST 抓取完成后
  workflow_dispatch:

concurrency:
  group: china-hr-si-phf-policy-digest
  cancel-in-progress: true

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install pyyaml requests markdown

      # 读 data/digest_new.json（服务器每日抓取后生成的新增条目）；
      # 无新增 / 无每日订阅者 / SMTP secrets 缺失时脚本自行退出，不报错。
      - name: Send daily digest (only when new items)
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          SUBSCRIBER_KEY: ${{ secrets.SUBSCRIBER_KEY }}
        run: python scripts/send_digest.py
