name: weekly refresh

on:
  schedule:
    - cron: "0 20 * * 0"      # 周日 20:00 UTC（周一 04:00 北京）——阿里云 01:00 CST 先跑，3 小时后 CI 拉取
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: china-hr-si-phf-policy-refresh
  cancel-in-progress: true

jobs:
  # 分批分次：70 城拆 4 个 shard 并行扫描，单片 ~18 城 ≈ 5 分钟，避免全量撞超时
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install pyyaml requests
      - name: Scan city shard ${{ matrix.shard }}
        run: python -m src.discover --shard ${{ matrix.shard }} --num-shards 4
      - name: Upload shard items
        uses: actions/upload-artifact@v4
        with:
          name: discovery-shard-${{ matrix.shard }}
          path: data/discovery-shard-${{ matrix.shard }}.json
          if-no-files-found: warn

  # 汇总：gov 部委检索 + 4 片发现结果 → 数字提取 → 周报 → 邮件 → 快照提交
  assemble:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install pyyaml requests markdown
      - name: Download shard items
        uses: actions/download-artifact@v4
        with:
          pattern: discovery-shard-*
          path: data
          merge-multiple: true
      - name: Pull Aliyun cloud data (aliyun-data branch, fallback URL)
        run: |
          git fetch origin aliyun-data:refs/remotes/origin/aliyun-data 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/aliyun-data; then
            if git show origin/aliyun-data:data/discovery-aliyun.json > data/discovery-aliyun.json 2>/dev/null; then
              echo "aliyun data fetched: $(wc -c < data/discovery-aliyun.json) bytes"
            else
              echo "aliyun data unavailable on branch (skipped)"
            fi
          else
            echo "aliyun-data branch not found (skipped)"
          fi
      - name: Build weekly report & notify
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SUBSCRIBER_KEY: ${{ secrets.SUBSCRIBER_KEY }}
        run: python -m src.main --mail --detail --detail-cap 80 --use-discovery
      - name: Commit snapshot
        run: |
          git config user.name "hr-si-phf-policy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "weekly digest $(date -u +%Y-%m-%d)"
            # Remote may have moved (local pushes since run start): rebase then push (retry once)
            git pull --rebase --autostash origin main || true
            git push || (sleep 5 && git pull --rebase --autostash origin main && git push)
          fi
