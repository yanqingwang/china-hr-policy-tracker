name: weekly refresh

on:
  schedule:
    - cron: "30 2 * * 1"     # 每周一 02:30 UTC（北京 10:30）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: china-hr-policy-refresh
  cancel-in-progress: true

jobs:
  # 分批分次：70 城拆 4 个 shard 并行扫描，单片 ~18 城 ≈ 5 分钟，避免全量撞超时
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install pyyaml requests
      - name: Scan city shard ${{ matrix.shard }}
        run: python -m src.discover --shard ${{ matrix.shard }} --num-shards 4
      - name: Upload shard items
        uses: actions/upload-artifact@v4
        with:
          name: discovery-shard-${{ matrix.shard }}
          path: data/discovery-shard-${{ matrix.shard }}.json
          if-no-files-found: warn

  # 汇总：gov 部委检索 + 4 片发现结果 → 数字提取 → 周报 → 邮件 → 快照提交
  assemble:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install pyyaml requests markdown
      - name: Download shard items
        uses: actions/download-artifact@v4
        with:
          pattern: discovery-shard-*
          path: data
          merge-multiple: true
      - name: Build weekly report & notify
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SUBSCRIBER_KEY: ${{ secrets.SUBSCRIBER_KEY }}
        run: python -m src.main --mail --detail --use-discovery
      - name: Commit snapshot
        run: |
          git config user.name "hr-policy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "weekly digest $(date -u +%Y-%m-%d)"
            # Remote may have moved (local pushes since run start): rebase then push (retry once)
            git pull --rebase --autostash origin main || true
            git push || (sleep 5 && git pull --rebase --autostash origin main && git push)
          fi
